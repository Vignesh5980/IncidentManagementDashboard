openapi: 3.0.3
info:
  title: Incident Management Dashboard API
  version: 1.0.0
  description: REST API for Incident and Service Request Management
paths:
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/incidents/:
    get:
      operationId: v1_incidents_list
      description: Retrieve a single active incident by ID.
      summary: Retrieve incident
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentResponse'
          description: Incident retrieved successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Incident not found.
    post:
      operationId: v1_incidents_create
      description: Create a new incident. The authenticated user is automatically
        set as the creator.
      summary: Create incident
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incident'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Incident'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Incident'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
          description: Incident created successfully.
        '400':
          description: Invalid incident data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '429':
          description: Request rate limit exceeded.
  /api/v1/incidents/{id}/:
    get:
      operationId: v1_incidents_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
          description: ''
    put:
      operationId: v1_incidents_update
      description: Update an existing incident.
      summary: Update incident
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incident'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Incident'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Incident'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
          description: Incident updated successfully.
        '400':
          description: Invalid incident data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Incident not found.
    patch:
      operationId: v1_incidents_partial_update
      description: Partially update an existing incident.
      summary: Partially update incident
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIncident'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIncident'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIncident'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
          description: Incident updated successfully.
        '400':
          description: Invalid incident data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Incident not found.
    delete:
      operationId: v1_incidents_destroy
      description: Soft delete an incident. The incident is marked as deleted and
        removed from normal API listings.
      summary: Delete incident
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Incident deleted successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Incident not found.
  /api/v1/service-requests/:
    get:
      operationId: v1_service_requests_list
      description: Retrieve service requests with optional filtering, searching, and
        ordering.
      summary: List service requests
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - P1
          - P2
          - P3
          - P4
        description: |-
          * `P1` - P1 - Critical
          * `P2` - P2 - High
          * `P3` - P3 - Medium
          * `P4` - P4 - Low
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - ASSIGNED
          - CLOSED
          - DRAFT
          - FULFILLED
          - IN_PROGRESS
          - PENDING_APPROVAL
          - REJECTED
          - SUBMITTED
        description: |-
          * `DRAFT` - Draft
          * `SUBMITTED` - Submitted
          * `PENDING_APPROVAL` - Pending Approval
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `ASSIGNED` - Assigned
          * `IN_PROGRESS` - In Progress
          * `FULFILLED` - Fulfilled
          * `CLOSED` - Closed
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceRequestList'
          description: Service requests retrieved successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
    post:
      operationId: v1_service_requests_create
      description: Create a new service request. The authenticated user is automatically
        assigned as the requester.
      summary: Create service request
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request created successfully.
        '400':
          description: Invalid service request data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
  /api/v1/service-requests/{id}/:
    get:
      operationId: v1_service_requests_retrieve
      description: Retrieve a single service request by ID.
      summary: Retrieve service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request retrieved successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Service request not found.
    put:
      operationId: v1_service_requests_update
      description: Replace an existing service request.
      summary: Update service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request updated successfully.
        '400':
          description: Invalid service request data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Service request not found.
    patch:
      operationId: v1_service_requests_partial_update
      description: Partially update an existing service request.
      summary: Partially update service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request updated successfully.
        '400':
          description: Invalid service request data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Service request not found.
    delete:
      operationId: v1_service_requests_destroy
      description: Delete an existing service request.
      summary: Delete service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Service request deleted successfully.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Permission denied.
        '404':
          description: Service request not found.
  /api/v1/service-requests/{id}/assign/:
    put:
      operationId: v1_service_requests_assign_update
      description: Assign a service request to a user. Only Admin and Team Lead users
        are permitted to perform this operation.
      summary: Assign service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request assigned successfully.
        '400':
          description: assigned_to is required.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only Admin or Team Lead can assign requests.
        '404':
          description: Service request not found.
    patch:
      operationId: v1_service_requests_assign_partial_update
      description: Assign a service request to a user. Only Admin and Team Lead users
        are permitted to perform this operation.
      summary: Partially assign service request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServiceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: Service request assigned successfully.
        '400':
          description: assigned_to is required.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only Admin or Team Lead can assign requests.
        '404':
          description: Service request not found.
components:
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        incident_number:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/IncidentStatusEnum'
        application:
          type: string
          maxLength: 100
        assigned_to:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - application
      - created_at
      - description
      - id
      - incident_number
      - resolved_at
      - title
    IncidentResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        status_code:
          type: integer
          default: 200
        message:
          type: string
          default: Incidents retrieved successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
      required:
      - data
    IncidentStatusEnum:
      enum:
      - OPEN
      - ASSIGNED
      - IN_PROGRESS
      - PENDING
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `ASSIGNED` - Assigned
        * `IN_PROGRESS` - In Progress
        * `PENDING` - Pending
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    PaginatedServiceRequestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequest'
    PatchedIncident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        incident_number:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/IncidentStatusEnum'
        application:
          type: string
          maxLength: 100
        assigned_to:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedServiceRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request_number:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        service:
          type: integer
          nullable: true
        category:
          type: string
          maxLength: 100
        subcategory:
          type: string
          maxLength: 100
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/ServiceRequestStatusEnum'
        requester:
          type: integer
          readOnly: true
          nullable: true
        requester_name:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        sla_due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sla_status:
          type: string
          readOnly: true
        approval_status:
          type: string
          readOnly: true
    PriorityEnum:
      enum:
      - P1
      - P2
      - P3
      - P4
      type: string
      description: |-
        * `P1` - P1 - Critical
        * `P2` - P2 - High
        * `P3` - P3 - Medium
        * `P4` - P4 - Low
    ServiceRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request_number:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        service:
          type: integer
          nullable: true
        category:
          type: string
          maxLength: 100
        subcategory:
          type: string
          maxLength: 100
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        status:
          $ref: '#/components/schemas/ServiceRequestStatusEnum'
        requester:
          type: integer
          readOnly: true
          nullable: true
        requester_name:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        assigned_to_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        sla_due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sla_status:
          type: string
          readOnly: true
        approval_status:
          type: string
          readOnly: true
      required:
      - approval_status
      - assigned_to_name
      - category
      - created_at
      - description
      - id
      - request_number
      - requester
      - requester_name
      - sla_due_at
      - sla_status
      - subcategory
      - title
      - updated_at
    ServiceRequestStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - PENDING_APPROVAL
      - APPROVED
      - REJECTED
      - ASSIGNED
      - IN_PROGRESS
      - FULFILLED
      - CLOSED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted
        * `PENDING_APPROVAL` - Pending Approval
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `ASSIGNED` - Assigned
        * `IN_PROGRESS` - In Progress
        * `FULFILLED` - Fulfilled
        * `CLOSED` - Closed
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
