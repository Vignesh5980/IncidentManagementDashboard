{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h4>
                Review Service Request
            </h4>
        </div>

        <div class="card-body">

            <div class="alert alert-info">

                <strong>
                    {{ service_request.request_number }}
                </strong>

                <br>

                {{ service_request.title }}

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Decision
                    </label>

                    {{ form.decision }}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Comments
                    </label>

                    {{ form.comments }}

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Decision
                </button>

                <a
                    href="{% url 'service_request_detail' service_request.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
